<!DOCTYPE html>

<html>

<head>

    <title>ClimateShield India</title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background-color: #f2f5f7;

            margin: 0;

            padding: 30px;

        }

        .container {

            width: 650px;

            margin: auto;

            background: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0,0,0,0.1);

        }

        h1 {

            text-align: center;

            margin-bottom: 5px;

        }

        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 25px;

        }

        label {

            font-weight: bold;

            display: block;

            margin-top: 12px;

        }

        input,
        select {

            width: 100%;

            padding: 10px;

            margin-top: 5px;

            border: 1px solid #ccc;

            border-radius: 5px;

            box-sizing: border-box;

        }

        button {

            width: 100%;

            padding: 13px;

            margin-top: 25px;

            border: none;

            border-radius: 6px;

            background-color: #198754;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        button:hover {

            background-color: #146c43;

        }

        /* ---------------------------------
           Prediction Result
           --------------------------------- */

        .result {

            margin-top: 25px;

            padding: 20px;

            text-align: center;

            border-radius: 8px;

            background-color: #e8f5e9;

            border: 1px solid #198754;

        }

        .result h2 {

            margin: 0;

            color: #198754;

        }

        .risk {

            font-size: 26px;

            font-weight: bold;

            margin-top: 10px;

        }

        /* ---------------------------------
           Error Message
           --------------------------------- */

        .error {

            margin-top: 20px;

            padding: 15px;

            background-color: #f8d7da;

            color: #842029;

            border-radius: 6px;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>ClimateShield India</h1>

    <div class="subtitle">

        Climate-Driven Disease Risk Prediction

    </div>


    <!-- ---------------------------------
         Prediction Form
         --------------------------------- -->

    <form method="POST" action="/predict">


        <!-- State -->

        <label>State / UT</label>

        <select name="state" id="state" required>

            <option value="">Select State / UT</option>

            {% for s in states %}

                <option value="{{ s }}"

                    {% if selected_state is defined and selected_state == s %}
                        selected
                    {% endif %}

                >

                    {{ s }}

                </option>

            {% endfor %}

        </select>


        <!-- District -->

        <label>District</label>

        <select name="district" id="district" required>

            <option value="">Select District</option>

            {% if districts is defined %}

                {% for d in districts %}

                    <option value="{{ d }}"

                        {% if selected_district is defined and selected_district == d %}
                            selected
                        {% endif %}

                    >

                        {{ d }}

                    </option>

                {% endfor %}

            {% endif %}

        </select>


        <!-- Disease -->

        <label>Disease</label>

        <select name="disease" required>

            <option value="">Select Disease</option>

            {% for d in diseases %}

                <option value="{{ d }}"

                    {% if selected_disease is defined and selected_disease == d %}
                        selected
                    {% endif %}

                >

                    {{ d }}

                </option>

            {% endfor %}

        </select>


        <!-- Week -->

        <label>Week of Outbreak</label>

        <select name="week" required>

            <option value="">Select Week</option>

            {% for w in weeks %}

                <option value="{{ w }}"

                    {% if selected_week is defined and selected_week == w %}
                        selected
                    {% endif %}

                >

                    {{ w }}

                </option>

            {% endfor %}

        </select>


        <!-- Day -->

        <label>Day</label>

        <input
            type="number"
            name="day"
            min="1"
            max="31"
            value="{{ selected_day if selected_day is defined else '' }}"
            required
        >


        <!-- Month -->

        <label>Month</label>

        <input
            type="number"
            name="month"
            min="1"
            max="12"
            value="{{ selected_month if selected_month is defined else '' }}"
            required
        >


        <!-- Year -->

        <label>Year</label>

        <input
            type="number"
            name="year"
            value="{{ selected_year if selected_year is defined else 2022 }}"
            required
        >


        <!-- Temperature -->

        <label>Temperature</label>

        <input
            type="number"
            step="0.01"
            name="temp"
            value="{{ selected_temp if selected_temp is defined else '' }}"
            required
        >


        <!-- Rainfall -->

        <label>Rainfall (preci)</label>

        <input
            type="number"
            step="0.000001"
            name="rain"
            value="{{ selected_rain if selected_rain is defined else '' }}"
            required
        >


        <!-- LAI -->

        <label>LAI</label>

        <input
            type="number"
            step="0.01"
            name="lai"
            value="{{ selected_lai if selected_lai is defined else '' }}"
            required
        >


        <!-- Predict Button -->

        <button type="submit">

            Predict Disease Risk

        </button>


    </form>


    <!-- ---------------------------------
         Prediction Result
         IMPORTANT:
         Result appears ONLY after prediction
         --------------------------------- -->

    {% if prediction %}

        <div class="result">

            <h2>Prediction Result</h2>

            <div class="risk">

                {{ prediction }}

            </div>

        </div>

    {% endif %}


    <!-- ---------------------------------
         Error Message
         --------------------------------- -->

    {% if error %}

        <div class="error">

            <strong>Error:</strong>

            {{ error }}

        </div>

    {% endif %}


</div>


<script>


// ---------------------------------------------
// Load districts when state changes
// ---------------------------------------------

document
    .getElementById("state")
    .addEventListener("change", function() {


        let state = this.value;

        let districtDropdown =
            document.getElementById("district");


        // Clear existing districts

        districtDropdown.innerHTML =
            '<option value="">Select District</option>';


        // If no state selected

        if (!state) {

            return;

        }


        // Get districts from Flask

        fetch(
            "/districts/" +
            encodeURIComponent(state)
        )

        .then(function(response) {

            return response.json();

        })

        .then(function(data) {


            data.districts.forEach(
                function(district) {


                    let option =
                        document.createElement("option");


                    option.value =
                        district;


                    option.text =
                        district;


                    districtDropdown.appendChild(
                        option
                    );


                }
            );


        })

        .catch(function(error) {

            console.error(
                "Error loading districts:",
                error
            );

        });


    });


</script>


</body>

</html>
